name: tests

# Everything in atlias was written and run on Windows. The platform assumptions
# were reasoned about rather than observed, and reasoning is where the last two
# platform bugs came from. This runs the whole suite on the platforms nobody
# here has, on every push, so the gap closes by evidence instead of argument.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No install step: atlias has no dependencies, which is the point.
      - name: syntax
        shell: bash
        run: for f in lib/*.mjs mcp/*.mjs bin/*.mjs test/run.mjs; do node --check "$f"; done
      - name: suite
        run: node test/run.mjs
      - name: the command line answers
        shell: bash
        run: |
          node bin/atlias.mjs --version
          NO_COLOR=1 node bin/atlias.mjs logo
          node bin/atlias.mjs agent --engine echo --once "ci is flying"
          node bin/atlias.mjs bench | head -5
      - name: install into a sandbox home and validate what was written
        run: node test/install-sandbox.mjs
      - name: the mcp server completes a handshake
        shell: bash
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{}}}' \
            | node mcp/server.mjs | grep -q '"name":"atlias"'
